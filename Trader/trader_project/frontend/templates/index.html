<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Joke</title>
  <!-- __CSS_URI__ is replaced at startup by main.py with an absolute file:// path -->
  <link rel="stylesheet" href="__CSS_URI__" />
</head>
<body>

  <main class="container">
    <header class="app-header">
      <span class="app-icon">🎭</span>
      <h1 class="app-title">Joke Machine</h1>
    </header>

    <button id="btn" class="btn-primary" onclick="ui.fetchJoke()">
      Tell me a joke
    </button>

    <section id="joke-box" class="joke-box" aria-live="polite" aria-atomic="true">
      <p id="setup"     class="joke-setup"></p>
      <p id="punchline" class="joke-punchline"></p>
      <p id="error"     class="joke-error" role="alert"></p>
    </section>
  </main>

  <!-- __JS_API_URI__ and __JS_UI_URI__ replaced at startup by main.py -->
  <script src="__JS_API_URI__"></script>
  <script src="__JS_UI_URI__"></script>

</body>
</html>
