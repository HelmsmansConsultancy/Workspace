<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Xerox</title>
  <!-- main.py replaces this token with the full contents of main.css -->
  __INLINE_CSS__
</head>
<body>
    <h1 class="app-title">Trade Xerox</h1>
    <main class="container">
        <div class="column column-left">
            <h2>Trade to Place</h2>
            <br />
            <table>
                <tr>
                    <td>Asset</td><td></td>
                </tr>
                <tr>
                    <td>Current price</td><td></td>
                </tr>
                <tr>
                    <td>Entry price</td><td><input type="number" inputmode="decimal" step="0.0001" /></td>
                </tr>
                <tr>
                    <td>SL price</td><td><input type="number" inputmode="decimal" step="0.0001"  /></td>
                </tr>
                <tr>
                    <td>TP price</td><td><input type="number" inputmode="decimal" step="0.0001" /></td>
                </tr>
                <tr>
                    <td>Amount</td><td><input type="number" inputmode="decimal" step="0.01" /></td>
                </tr>
                <tr>
                    <td>R-unit</td><td><select>
                        <option>0.1%</option>
                        <option>0.5%</option>
                        <option selected>1%</option>
                        <option>2%</option>
                    </select></td>
                </tr>
            </table>
            <br /><br />
            <h3>Last Trade</h3>
            <br />
            <table>
                <tr>
                    <td>Asset</td><td></td>
                </tr>
                <tr>
                    <td>Current price</td><td></td>
                </tr>
                <tr>
                    <td>Entry price</td><td></td>
                </tr>
                <tr>
                    <td>SL price</td><td></td>
                </tr>
                <tr>
                    <td>TP price</td><td></td>
                </tr>
                <tr>
                    <td>Amount</td><td></td>
                </tr>
                <tr>
                    <td>R-unit</td><td>1%</td>
                </tr>
            </table>
        </div>
        <div class="column column-middle">
            <h2>Trade Overview</h2>
        </div>
        <div class="column column-right">
            <h2>Configuration</h2>
            <br />
            <label for="config" class="config-label">config</label>
            <button id="config" class="select-button">Select XML file...</button>
            <span id="filename" class="filename"></span>
            <br /><br />
            <h3>Accounts</h3>
            <br />
            <div id="tree-container" class="tree-container"></div>
        </div>
    </main>
    <footer class="footer">
        <div  class="column column-bottom">
            <div id="message" class="message"></div>
        </div>
    </footer>
    

  <!-- main.py replaces these tokens with the contents of api.js and ui.js -->
  __INLINE_JS_API__
  __INLINE_JS_UI__

</body>
</html>
