[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name            = "ohlc-tools"
version         = "0.1.0"
description     = "Command-line tools for analysing and manipulating OHLC CSV data"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.10"

keywords = ["ohlc", "trading", "finance", "cli", "csv"]

authors = [
    { name = "Your Name", email = "you@example.com" }
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "rich>=13.0",       # pretty terminal output
    "click>=8.1",       # CLI framework
    "pytz>=2024.1",     # timezone handling
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "pandas-stubs",
]

# ---------------------------------------------------------------------------
# Entry points — each command registered here becomes a shell command
# ---------------------------------------------------------------------------
[project.scripts]
ohlc          = "ohlc_tools.cli:main"
ohlc-tobar = "ohlc_tools.commands.tobar:cli"
ohlc-describe = "ohlc_tools.commands.describe:cli"
ohlc-convert  = "ohlc_tools.commands.convert:cli"
ohlc-resample = "ohlc_tools.commands.resample:cli"

# ---------------------------------------------------------------------------
# Setuptools package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["ohlc_tools*"]

# ---------------------------------------------------------------------------
# Ruff linter (replaces flake8 + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 88
target-version = "py310"
exclude        = [".spyproject", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Black formatter
# ---------------------------------------------------------------------------
[tool.black]
line-length    = 88
target-version = ["py310", "py311", "py312"]

# ---------------------------------------------------------------------------
# Mypy type-checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.10"
strict                 = false
ignore_missing_imports = true
warn_unused_ignores    = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths      = ["tests"]
addopts        = "-v --tb=short --cov=ohlc_tools --cov-report=term-missing"
